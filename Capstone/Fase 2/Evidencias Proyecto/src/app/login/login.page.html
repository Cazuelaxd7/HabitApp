<ion-content [fullscreen]="true" class="login-content">
  <div class="login-page">

    <div class="login-hero">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11L12 3L21 11" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>HabitApp</h1>
      <p>Gestiona tu comunidad desde un solo lugar.</p>
    </div>

    <div class="login-sheet">
      <form (ngSubmit)="onSubmit()">
        <div class="hb-field">
          <label>Correo electrónico</label>
          <svg class="hb-field-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input type="email" [(ngModel)]="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required />
        </div>

        <div class="hb-field">
          <label>Contraseña</label>
          <svg class="hb-field-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
          <button class="hb-field-toggle" type="button" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M9.9 4.24A10.4 10.4 0 0 1 12 4c6 0 10 7 10 7a17 17 0 0 1-3.3 4.1M6.5 6.6C4 8.3 2 11 2 11s4 7 10 7c1.2 0 2.3-.2 3.3-.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

        <button class="primary-button" type="submit" [disabled]="cargando">
          {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>

        <button class="text-button login-forgot" type="button" (click)="onForgotPassword()">
          ¿Olvidaste tu contraseña?
        </button>
      </form>

      <div class="login-divider"><span>o</span></div>

      <p class="login-register-text">
        ¿Aún no tienes cuenta?
        <button class="text-button" type="button" (click)="goToRegister()">Regístrate</button>
      </p>
    </div>

  </div>
</ion-content>
